[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lolcoach"
version = "0.2.0"
description = "Coach IA pour League of Legends : collecte via l'API Riot, modèle de prédiction entraîné maison, conseils en langage naturel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.0"]

[project.scripts]
lolcoach-collecte = "lolcoach.collecte.cli:main"
lolcoach-entrainer = "lolcoach.modele.cli:main"
lolcoach-coach = "lolcoach.coach.cli:main"
lolcoach-api = "lolcoach.api.server:main"
lolcoach-demo = "lolcoach.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lolcoach = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
